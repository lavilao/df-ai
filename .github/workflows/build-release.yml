name: Build and Release df-ai Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a release

    steps:
      - name: Checkout df-ai source
        uses: actions/checkout@v4
        with:
          path: df-ai-src # Checkout df-ai to a specific subdirectory

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libboost-all-dev git wget tar gzip build-essential rsync

      - name: Get current date and time
        id: datetime
        run: echo "datetime=$(date --utc +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Clone DFHack and Initialize Submodules
        run: |
          echo "::group::Cloning DFHack 0.47.05-r8"
          git clone --depth 1 --branch 0.47.05-r8 https://github.com/DFHack/dfhack.git dfhack-src
          echo "::endgroup::"

          echo "::group::Initializing DFHack submodules"
          cd dfhack-src
          git submodule update --init --recursive
          cd $GITHUB_WORKSPACE
          echo "::endgroup::"

      - name: Integrate df-ai into DFHack plugins
        run: |
          echo "::group::Moving df-ai source into DFHack plugins directory"
          mkdir -p dfhack-src/plugins/df-ai
          rsync -av --delete --exclude='.git' df-ai-src/ dfhack-src/plugins/df-ai/
          echo "::endgroup::"

          echo "::group::Updating DFHack custom CMake file"
          echo 'add_subdirectory(df-ai)' >> dfhack-src/plugins/CMakeLists.custom.txt
          echo "::notice::Added df-ai to dfhack-src/plugins/CMakeLists.custom.txt"
          echo "::endgroup::"

    - name: Build DFHack and df-ai plugin
      run: |
        echo "::group::Building DFHack (which includes df-ai plugin)"
        mkdir -p dfhack-src/build
        cd dfhack-src/build
        cmake ..
        make -j$(nproc) df-ai # Assuming 'df-ai' is the correct make target for the plugin
        echo "::endgroup::"
        cd $GITHUB_WORKSPACE

    - name: Package Plugin
      run: |
        PLUGIN_BASENAME="df-ai" # Base name for the plugin
        PLUGIN_SUFFIX=".plug.so" # Assuming Linux output name
        PLUGIN_FILENAME="${PLUGIN_BASENAME}${PLUGIN_SUFFIX}"
        EXPECTED_PLUGIN_PATH="$GITHUB_WORKSPACE/dfhack-src/build/plugins/${PLUGIN_BASENAME}/${PLUGIN_FILENAME}"

        ARTIFACT_NAME="df-ai-0.47.05-r8-build" # Using a more static artifact name for the tarball itself

        echo "::group::Preparing package directory"
        mkdir -p release_package/df-ai-blueprints

        echo "::notice::Looking for plugin at $EXPECTED_PLUGIN_PATH"
        if [ -f "$EXPECTED_PLUGIN_PATH" ]; then
          cp "$EXPECTED_PLUGIN_PATH" "release_package/"
          echo "::notice::Copied $PLUGIN_FILENAME to release_package/"
        else
          echo "::error::Built plugin $PLUGIN_FILENAME not found at $EXPECTED_PLUGIN_PATH. Creating a dummy file for packaging demonstration."
          touch "release_package/$PLUGIN_FILENAME" # Dummy file
        fi

        # Copy blueprint assets from the df-ai source now integrated into dfhack-src
        BLUEPRINT_SRC_BASE="$GITHUB_WORKSPACE/dfhack-src/plugins/df-ai"
        if [ -d "${BLUEPRINT_SRC_BASE}/rooms" ]; then
          cp -r "${BLUEPRINT_SRC_BASE}/rooms" "release_package/df-ai-blueprints/"
          echo "::notice::Copied rooms blueprints."
        else
          echo "::warning::Blueprint 'rooms' directory not found at ${BLUEPRINT_SRC_BASE}/rooms."
        fi
        if [ -d "${BLUEPRINT_SRC_BASE}/plans" ]; then
          cp -r "${BLUEPRINT_SRC_BASE}/plans" "release_package/df-ai-blueprints/"
          echo "::notice::Copied plans blueprints."
        else
          echo "::warning::Blueprint 'plans' directory not found at ${BLUEPRINT_SRC_BASE}/plans."
        fi
        echo "::endgroup::"

        echo "::group::Creating archive"
        tar -czvf "${ARTIFACT_NAME}.tar.gz" -C release_package .
        echo "::endgroup::"
        echo "ARTIFACT_PATH=${ARTIFACT_NAME}.tar.gz" >> $GITHUB_ENV
        echo "ARTIFACT_UPLOAD_NAME=${ARTIFACT_NAME}-${{ steps.datetime.outputs.datetime }}.tar.gz" >> $GITHUB_ENV


    - name: Create Release and Upload Asset
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        RELEASE_TAG="v0.47.05-r8-${{ steps.datetime.outputs.datetime }}"
        ARTIFACT_PATH_LOCAL="${{ env.ARTIFACT_PATH }}" # e.g., df-ai-0.47.05-r8-build.tar.gz
        ARTIFACT_UPLOAD_AS_NAME="${{ env.ARTIFACT_UPLOAD_NAME }}" # e.g., df-ai-0.47.05-r8-build-YYYYMMDDHHMMSS.tar.gz

        if [ ! -f "$ARTIFACT_PATH_LOCAL" ]; then
          echo "::error::Artifact $ARTIFACT_PATH_LOCAL not found!"
          exit 1
        fi

        echo "::notice::Creating release $RELEASE_TAG and uploading $ARTIFACT_PATH_LOCAL as $ARTIFACT_UPLOAD_AS_NAME"
        gh release create "$RELEASE_TAG" \
            --title "df-ai for DFHack 0.47.05-r8 (Build ${{ steps.datetime.outputs.datetime }})" \
            --notes "Automated build of df-ai (targeting DFHack 0.47.05-r8) by building as a plugin within the DFHack source tree. DFHack 0.47.05-r8 was cloned and its submodules initialized for this build. Please check build logs for success." \
            "$ARTIFACT_PATH_LOCAL#$ARTIFACT_UPLOAD_AS_NAME" # Use # to specify a different display name for the asset
        echo "::notice::Release creation attempted."
