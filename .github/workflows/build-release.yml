name: Build and Release df-ai Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libboost-all-dev

      - name: DFHack SDK Setup (Placeholder - Requires Manual Configuration)
        run: |
          echo "::warning:: DFHack SDK setup is a placeholder."
          echo "::warning:: You MUST configure this step manually to point to a DFHack 0.47.05-r8 SDK."
          echo "::warning:: Common methods include:"
          echo "::warning:: 1. Downloading a pre-built SDK:"
          echo "::warning::    wget https://example.com/dfhack-0.47.05-r8-sdk.tar.gz -O dfhack_sdk.tar.gz"
          echo "::warning::    tar -xzf dfhack_sdk.tar.gz -C /opt/dfhack-sdk"
          echo "::warning::    (Then set CMAKE_TOOLCHAIN_FILE or CMAKE_PREFIX_PATH below)"
          echo "::warning:: 2. Checking out DFHack source at the correct tag and building/using its SDK components:"
          echo "::warning::    git clone https://github.com/DFHack/dfhack.git /opt/dfhack-sdk-src"
          echo "::warning::    cd /opt/dfhack-sdk-src && git checkout 0.47.05-r8"
          echo "::warning::    (This might involve building parts of DFHack or using its CMake modules directly)"
          echo "::warning:: 3. Ensure environment variables like CMAKE_TOOLCHAIN_FILE are set, e.g.:"
          echo "::warning::    # export CMAKE_TOOLCHAIN_FILE=/opt/dfhack-sdk/0.47.05-r8/share/dfhack/cmake/DFHackToolchain.cmake"
          echo "::warning::    # Or add to CMAKE_PREFIX_PATH: export CMAKE_PREFIX_PATH=/opt/dfhack-sdk/0.47.05-r8:$CMAKE_PREFIX_PATH"
          echo "::error:: This workflow will likely fail at the CMake step without a correctly configured DFHack SDK."

      - name: Build Plugin
        run: |
          mkdir build
          cd build
          # The CMAKE_TOOLCHAIN_FILE path below is an EXAMPLE and needs to be set based on actual SDK location
          # If the SDK is installed in a standard location or CMAKE_PREFIX_PATH is set, it might be found automatically.
          # Otherwise, you might need:
          # cmake -DCMAKE_TOOLCHAIN_FILE=/path/to/your/dfhack-sdk/cmake/DFHackToolchain.cmake ..
          cmake ..
          make

      - name: Package Plugin
        run: |
          PLUGIN_NAME="df-ai.plug.so" # Assuming Linux output name
          ARTIFACT_NAME="df-ai-plugin-0.47.05-r8-${{ github.run_id }}"
          mkdir -p release_package/df-ai-blueprints
          # Copy the plugin binary (path might vary depending on CMakeLists.txt)
          # Assuming it's in build/plugins/ if DFHACK_PLUGIN macro is used
          if [ -f "build/plugins/$PLUGIN_NAME" ]; then
            cp "build/plugins/$PLUGIN_NAME" "release_package/"
          elif [ -f "build/$PLUGIN_NAME" ]; then
            cp "build/$PLUGIN_NAME" "release_package/"
          else
            echo "::error::Built plugin $PLUGIN_NAME not found in common locations (build/ or build/plugins/)."
            # Create a dummy file to allow packaging to proceed for demonstration,
            # but this indicates a build or path issue.
            touch "release_package/$PLUGIN_NAME"
          fi
          # Copy blueprint assets (adjust paths if necessary based on CMake install prefix)
          # Assuming CMake install puts them in build/df-ai-blueprints/
          cp -r build/df-ai-blueprints/rooms release_package/df-ai-blueprints/
          cp -r build/df-ai-blueprints/plans release_package/df-ai-blueprints/

          tar -czvf "${ARTIFACT_NAME}.tar.gz" -C release_package .

      - name: Create Release and Upload Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="v0.47.05-r8-build-${{ github.run_id }}"
          ARTIFACT_BASENAME="df-ai-plugin-0.47.05-r8-${{ github.run_id }}"
          gh release create "$RELEASE_TAG" \
              --title "df-ai for DFHack 0.47.05-r8 (Build ${{ github.run_id }})" \
              --notes "Automated build of df-ai targeting DFHack 0.47.05-r8. IMPORTANT: This build was generated by a GitHub Action. The DFHack SDK setup step in the workflow is a placeholder and requires manual configuration for successful compilation with the correct DFHack version. This release may not be functional if the SDK was not correctly integrated during the build process." \
              "${ARTIFACT_BASENAME}.tar.gz"

      # Fallback: Create Release and Upload Asset (using actions/create-release and actions/upload-release-asset)
      # This is an alternative if the `gh release create` command above has issues in some environments
      # or if you prefer using these actions explicitly.
